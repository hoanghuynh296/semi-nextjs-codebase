name: Check

# One run per PR push (agents always open a PR, so a separate push run was a duplicate); a newer push cancels the
# older run of the same ref (about 4.5 min wall: 1 min build + 3 min shards). main runs the same checks in deploy-storybook.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: npm run check

      - name: Build Next.js Static Storybook
        run: npx next build

      - name: "Prerender regression build (#82: bare ToastHost in a root layout, dynamic route)"
        run: npm run build:prerender-test

      - name: Build the sample brand book (tests/fixtures/brand.json)
        run: npm run build:brand-book

      - name: Upload the builds for the browser shards
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            out
            out-brand
            tests/prerender-app/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  ui:
    name: "ui (shard ${{ matrix.shard }}/6)"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          name: builds

      - name: Install WebKit and Firefox when this shard runs the IME test
        run: |
          if npx playwright test --list --shard=${{ matrix.shard }}/6 | grep -q "hint-textarea-ime"; then
            npx playwright install --with-deps webkit firefox
          fi

      - name: "Browser checks (docs and brand book: contrast AA both themes, axe, phone widths, theme, keyboard), shard ${{ matrix.shard }}/6"
        run: npm run test:ui -- --shard=${{ matrix.shard }}/6

  # #185: the plugin scripts' token lookup and no-network paths on Windows (cmd.exe has no printf or /dev/null). Node
  # built-ins only: no npm ci, no build, no browsers.
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: "Plugin scripts --help (no network)"
        run: |
          node plugin/skills/semi-propose/scripts/propose.mjs --help
          node plugin/skills/semi-triage/scripts/triage.mjs --help

      - name: "Token lookup without GH_TOKEN / GITHUB_TOKEN: a token or NO_TOKEN, never a throw"
        run: node --test lint/test/github-token.test.mjs

      - name: "npm, pnpm and node_modules/.bin tools run through node (no .cmd, no shell); CHANGELOG headings (#216)"
        run: node --test lint/test/plugin-spawn.test.mjs

  # The one required status (branch protection keeps the name `check`): fails when the build, any shard or windows fails or is
  # cancelled.
  check:
    needs: [build, ui, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo "build: ${{ needs.build.result }}, ui: ${{ needs.ui.result }}, windows: ${{ needs.windows.result }}"
          [ "${{ needs.build.result }}" = success ] && [ "${{ needs.ui.result }}" = success ] && [ "${{ needs.windows.result }}" = success ]
