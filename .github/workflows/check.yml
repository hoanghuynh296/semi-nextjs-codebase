name: Check

on:
  pull_request:
  push:
    branches-ignore:
      - main # main runs the same checks in deploy-storybook.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: npm run check

      - name: Build Next.js Static Storybook
        run: npx next build

      - name: Build the sample brand book (tests/fixtures/brand.json)
        run: npm run build:brand-book

      - name: Browser checks (docs and brand book: contrast AA both themes, axe, phone widths, theme, keyboard)
        run: npm run test:ui
