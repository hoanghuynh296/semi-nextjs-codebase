name: Check

# One run per PR push (agents always open a PR, so a separate push run was a duplicate); a newer push cancels the
# older run of the same ref (about 4.5 min wall: 1 min build + 3 min shards). main runs the same checks in deploy-storybook.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: npm run check

      - name: Build Next.js Static Storybook
        run: npx next build

      - name: "Prerender regression build (#82: bare ToastHost in a root layout, dynamic route)"
        run: npm run build:prerender-test

      - name: Build the sample brand book (tests/fixtures/brand.json)
        run: npm run build:brand-book

      - name: Upload the builds for the browser shards
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            out
            out-brand
            tests/prerender-app/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  ui:
    name: "ui (shard ${{ matrix.shard }}/6)"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          name: builds

      - name: "Browser checks (docs and brand book: contrast AA both themes, axe, phone widths, theme, keyboard), shard ${{ matrix.shard }}/6"
        run: npm run test:ui -- --shard=${{ matrix.shard }}/6

  # The one required status (branch protection keeps the name `check`): fails when the build or any shard fails or is
  # cancelled.
  check:
    needs: [build, ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo "build: ${{ needs.build.result }}, ui: ${{ needs.ui.result }}"
          [ "${{ needs.build.result }}" = success ] && [ "${{ needs.ui.result }}" = success ]
